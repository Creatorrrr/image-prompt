name: Photo skill unused imports

on:
  pull_request:
    paths:
      - 'ruff.toml'
      - '.github/workflows/photo-skill-imports.yml'
      - 'skills/photo-prompt-image-generator/scripts/**'
      - 'skills/photo-prompt-image-generator/precore/**'
  push:
    branches: [main]
    paths:
      - 'ruff.toml'
      - '.github/workflows/photo-skill-imports.yml'
      - 'skills/photo-prompt-image-generator/scripts/**'
      - 'skills/photo-prompt-image-generator/precore/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unused-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install --disable-pip-version-check 'ruff==0.15.1'
      - name: Check maintained photo skill imports
        run: >-
          ruff check --no-cache
          skills/photo-prompt-image-generator/scripts
          skills/photo-prompt-image-generator/precore
